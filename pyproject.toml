[project]
name = "sql-performance-lab"
version = "0.1.0"
description = "Measuring and fixing slow analytical SQL on PostgreSQL with tens of millions of rows."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pglast>=7.0",
    "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = [
    # ruff, mypy, pytest and pre-commit at the versions pinned by the toolkit
    "data-ml-toolkit[dev]",
    "black>=26.10.1",
]

[tool.uv]
package = false

# Shared dev tool pins: https://github.com/armandpl1/data-ml-toolkit
[tool.uv.sources]
data-ml-toolkit = { git = "https://github.com/armandpl1/data-ml-toolkit", tag = "v0.1.0" }

[tool.black]
line-length = 88

[tool.ruff]
line-length = 88

[tool.pytest.ini_options]
testpaths = ["tests"]
