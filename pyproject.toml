[project]
name = "sql-performance-lab"
version = "0.1.0"
description = "Measuring and fixing slow analytical SQL on PostgreSQL with tens of millions of rows."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pglast>=7.0",
    "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = [
    "black>=26.10.1",
    "pre-commit>=4.7.0",
    "pytest>=8.0",
    "ruff>=0.17.4",
]

[tool.uv]
package = false

[tool.black]
line-length = 88

[tool.ruff]
line-length = 88

[tool.pytest.ini_options]
testpaths = ["tests"]
