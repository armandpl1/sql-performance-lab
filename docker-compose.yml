# Local PostgreSQL for the performance lab.
# Start: docker compose up -d     Stop: docker compose down
# Data persists in the "pgdata" volume until: docker compose down -v
services:
  postgres:
    image: postgres:17
    container_name: perf-lab-postgres
    environment:
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: lab
      POSTGRES_DB: lab
    ports:
      - "5432:5432"
    # Parallel query needs more shared memory than Docker's 64MB default
    shm_size: 1gb
    command:
      - postgres
      # Sized for a laptop with ~8 GB RAM. Recorded with every benchmark.
      - -c
      - shared_buffers=1GB
      - -c
      - effective_cache_size=3GB
      - -c
      - work_mem=64MB
      - -c
      - maintenance_work_mem=512MB
      - -c
      - max_parallel_workers_per_gather=4
      # Show I/O time in EXPLAIN (ANALYZE, BUFFERS)
      - -c
      - track_io_timing=on
      # Per-query statistics, used in later steps
      - -c
      - shared_preload_libraries=pg_stat_statements
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab -d lab"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
